name: Build MyCloud 5GB APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/mycloud/fivegb
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyCloud5GB"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.mycloud.fivegb"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.mycloud.fivegb"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="MyCloud 5GB"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#5B4BFF</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080D1D</item>
                  <item name="android:navigationBarColor">#080D1D</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/mycloud/fivegb/MainActivity.kt <<'EOF'
          package com.mycloud.fivegb

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.webkit.CookieManager
          import android.webkit.DownloadListener
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private var fileCallback: ValueCallback<Array<Uri>>? = null
              private val filePickerRequest = 1001

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = android.graphics.Color.rgb(8, 13, 29)
                  window.navigationBarColor = android.graphics.Color.rgb(8, 13, 29)

                  webView = WebView(this)
                  setContentView(webView)

                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true)

                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.allowFileAccess = false
                  webView.settings.javaScriptCanOpenWindowsAutomatically = true
                  webView.settings.setSupportMultipleWindows(false)

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(
                          view: WebView,
                          request: WebResourceRequest
                      ): Boolean {
                          val url = request.url
                          return if (url.scheme == "http" || url.scheme == "https") {
                              false
                          } else {
                              try {
                                  startActivity(Intent(Intent.ACTION_VIEW, url))
                              } catch (_: Exception) {
                                  Toast.makeText(this@MainActivity, "লিংকটি খোলা যাচ্ছে না", Toast.LENGTH_SHORT).show()
                              }
                              true
                          }
                      }
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          view: WebView?,
                          callback: ValueCallback<Array<Uri>>?,
                          params: FileChooserParams?
                      ): Boolean {
                          fileCallback?.onReceiveValue(null)
                          fileCallback = callback
                          val intent = params?.createIntent() ?: Intent(Intent.ACTION_GET_CONTENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                          }
                          return try {
                              startActivityForResult(intent, filePickerRequest)
                              true
                          } catch (_: Exception) {
                              fileCallback = null
                              false
                          }
                      }
                  }

                  webView.setDownloadListener(DownloadListener { url, _, _, mimeType, _ ->
                      try {
                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                      } catch (_: Exception) {
                          Toast.makeText(this, "ডাউনলোড লিংক খোলা যাচ্ছে না", Toast.LENGTH_LONG).show()
                      }
                  })

                  if (savedInstanceState == null) {
                      webView.loadUrl("https://ais-dev-azzaskuuys65fueykpk26t-422810074410.asia-northeast1.run.app/")
                  } else {
                      webView.restoreState(savedInstanceState)
                  }
              }

              @Deprecated("Deprecated by Android, retained for WebView file chooser compatibility")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == filePickerRequest) {
                      val result = if (resultCode == Activity.RESULT_OK && data?.data != null) {
                          arrayOf(data.data!!)
                      } else null
                      fileCallback?.onReceiveValue(result)
                      fileCallback = null
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  webView.saveState(outState)
                  super.onSaveInstanceState(outState)
              }

              @Deprecated("Deprecated by Android")
              override fun onBackPressed() {
                  if (::webView.isInitialized && webView.canGoBack()) webView.goBack()
                  else super.onBackPressed()
              }

              override fun onDestroy() {
                  if (::webView.isInitialized) webView.destroy()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyCloud-5GB-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
